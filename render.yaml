# Render Blueprint: the whole product (API, PayPal simulator or sandbox, web app) as one Docker web service plus Postgres.
# See docs/setup.md, "Deploying to Render". Plans and prices change; check Render's current plans before applying. A free
# Postgres database is deleted after a short period, which would not last until the end of judging, so a paid one is used.

services:
  - type: web
    name: warrant
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: warrant-db
          property: connectionString
      # PUBLIC_BASE_URL is taken from RENDER_EXTERNAL_URL, which Render sets; set it only for a custom domain.

      # --- Signing keys: generate once with `pnpm keygen`, never commit them. ---
      - key: WALLET_SIGNING_KEY
        sync: false
      - key: AGENT_PLATFORM_SIGNING_KEY
        sync: false
      - key: REGISTRY_LOG_KEY
        sync: false

      # --- PayPal. "sandbox" needs the four values below; "simulator" needs none (a demo with the built-in stand-in). ---
      - key: PAYPAL_ENV
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_MERCHANT_ID
        sync: false

      # --- Models and catalog. "live" needs both keys; "fixtures" needs neither (deterministic products and text). ---
      - key: WARRANT_MODE
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false

      # --- Hosted-demo safety. ---
      - key: JUDGE_MODE_ENABLED
        value: "true"
      - key: CONSOLE_TOKEN
        generateValue: true
      - key: DISPUTE_AUTOPILOT
        value: "false"
      - key: LLM_DAILY_BUDGET_USD
        value: "20"
      - key: LLM_RUNS_PER_VISITOR
        value: "15"

databases:
  - name: warrant-db
    plan: basic-256mb
    databaseName: warrant
    user: warrant
