name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      sandbox:
        description: "Also run the PayPal sandbox integration tests (needs the PAYPAL_* repository secrets)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck, lint, test, eval (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      # The pnpm version comes from "packageManager" in the root package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint

      # Documentation links resolve, and nothing that looks like a secret is committed.
      - run: pnpm docs:check
      - run: pnpm secrets:check

      # Unit, property, service and component tests with coverage thresholds in every package.
      - run: pnpm test

      # The published test vectors are generated from the library; regenerating them must change nothing.
      - run: pnpm --filter @warrant/warrant run vectors
      - run: git diff --exit-code -- docs/test-vectors.json

      # The labelled scenario corpus through the real pipeline. Exits 1 if any scenario does not do what its label says.
      - run: pnpm eval

      - name: Upload coverage
        if: matrix.node == 24
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            packages/*/coverage
            apps/*/coverage
            sim/coverage
          if-no-files-found: warn

      - name: Upload evaluation report
        if: matrix.node == 24
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: sim/report.json

  e2e:
    name: end to end (Playwright, fixtures mode, PayPal simulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @warrant/e2e exec playwright install --with-deps chromium
      # Builds the web app, then starts the real server on a temporary database and drives it from a browser.
      - run: pnpm e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore

  container:
    name: container image starts and serves the app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t warrant:ci .
      - name: Start it as the zero-config demo and check it answers
        run: |
          docker run -d --name warrant -p 8787:8787 -e NODE_ENV=development -e WEB_ORIGIN=http://localhost:8787 warrant:ci
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8787/api/health >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8787/api/health
          curl -fsS http://localhost:8787/ | grep -qi "<div id=\"root\">"
          curl -fsS http://localhost:8787/api/config | grep -q '"paypalEnv":"simulator"'
      - name: The production default refuses to start without real keys
        run: |
          docker rm -f warrant >/dev/null
          if docker run --rm warrant:ci 2>&1 | grep -q "WALLET_SIGNING_KEY is required in production"; then echo "refused, as intended"; else echo "expected a refusal"; exit 1; fi
      - if: failure()
        run: docker logs warrant || true

  sandbox:
    name: PayPal sandbox integration tests (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.sandbox
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:int
        env:
          PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
          PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
          PAYPAL_WEBHOOK_ID: ${{ secrets.PAYPAL_WEBHOOK_ID }}
